<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  #map { height: 100%; width: 100%; background: #0B0F14; }
  /* Car-sized zoom buttons: the default Leaflet controls are too small to tap on the car. */
  .leaflet-control-zoom a { width: 56px !important; height: 56px !important; line-height: 56px !important; font-size: 34px !important; }
  .leaflet-control-attribution { font-size: 14px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map', { zoomControl: true }).setView([11.55, 104.92], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  L.marker([11.55, 104.92]).addTo(map).bindPopup('Phnom Penh').openPopup();
</script>
</body>
</html>
