name: Release APK

# Publishes a GitHub Release with the APK from a build run.
# Run it manually from Actions -> Release APK -> Run workflow.
# It downloads the build artifact itself (inside GitHub) and attaches
# the APK to the new release. Release notes come from CHANGELOG.md,
# so the changelog is the single source of truth for release notes.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID to release (empty = latest successful build)'
        required: false
        type: string
      tag:
        description: 'Release tag (e.g. v0.42.0.47-research)'
        required: true
        type: string
      title:
        description: 'Release title (e.g. AionLink Open X 0.42.0.47-research)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Find the build run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          else
            RUN_ID=$(gh run list --workflow build-apk.yml --limit 10 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful build run found" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using build run $RUN_ID"

      - name: Download the build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.find.outputs.run_id }}" --name aionlink-open-x-apk --dir apk
          ls -l apk
          sha256sum apk/*.apk

      - name: Build the release notes from CHANGELOG.md
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($2 == ver) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry found for $VERSION" >&2
            exit 1
          fi
          {
            echo ""
            echo "Full changelog: CHANGELOG.md in this repo."
            echo "Installs over the previous build in place — same signing key, settings and QUICK keys kept."
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --target main --title "${{ inputs.title }}" --notes-file notes.md apk/*.apk
          gh release view "${{ inputs.tag }}" --json tagName,name,assets --jq '{tag: .tagName, title: .name, assets: [.assets[] | {name: .name, size: .size}]}'
