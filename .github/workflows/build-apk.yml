name: Build AionLink APK

# Builds the debug APK for AionLink Probe (lab variant) on every push /
# pull request to main. Probe is the only variant: AionLink Open was the
# same code with a different package name, kept only so its author could
# test without overwriting his daily app.
# Signing: the repo secrets ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD hold the shared AionLink key (the same key
# OpenHeadunit Lite uses), so the bridge between the two apps works.
# The secrets must be set: the signing steps run unconditionally, because
# `secrets` cannot be used in an `if:` condition (GitHub rejects the
# workflow file with "Unrecognized named-value: 'secrets'").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The snapshot import that populated this repo did not preserve the
      # executable bit on gradlew, so make it executable here.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android@v3 fails here: it tries to install the
      # legacy "tools" package, which Google removed in favour of
      # cmdline-tools. Install the exact components this build needs instead.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Shared signing key (see android/app/build.gradle.kts: it reads
      # android/keystore.properties when present).
      - name: Set up shared signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > shared-signing.keystore
          cat > keystore.properties <<EOF
          storeFile=shared-signing.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # Fail fast with a clear message if the secret did not survive
          # entry intact (a truncated keystore fails signing opaquely).
          # The keystore must be 2716 bytes, cert SHA-256 F9:B2:C3:D4:2E:70:...
          echo "keystore bytes: $(wc -c < shared-signing.keystore)"
          keytool -list -keystore shared-signing.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Run Python unit tests
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s tests/unit -v

      - name: Run JVM unit tests
        run: ./gradlew :core:test :protocol-iccoa:test :projection:test :transport-bluetooth:testDebugUnitTest :transport-wifi:testDebugUnitTest --no-daemon --console=plain

      - name: Build AionLink Probe / lab variant (debug)
        run: ./gradlew :app:assembleDebug -PaionlinkLab --no-daemon --console=plain

      - name: Save AionLink Probe APK
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/artifacts/aionlink-probe-${VERSION}.apk"
          ls -l "${{ github.workspace }}/artifacts"

      # Prints the signing certificate of the APK; with the shared key it
      # must be SHA-256 F9:B2:C3:D4:2E:70:E5:84:2E:3F:90:BD:20:EE:4F:54:AB:C4:BA:EE:93:2F:96:9A:82:10:EA:43:D1:96:38:72.
      - name: Verify signature uses the shared key
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          "$APKSIGNER" verify --print-certs "${{ github.workspace }}/artifacts/aionlink-probe-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aionlink-probe-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
